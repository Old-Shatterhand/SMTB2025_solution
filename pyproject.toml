[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plmlayer"
version = "0.1.0"
description = "Pick the best layer of a protein language model for your dataset, and get back a truncated model."
readme = "README_plmlayer.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Roman Joeres" },
    { name = "Ilya Senatorov" },
]
keywords = ["protein language model", "layer selection", "probing", "esm", "bioinformatics"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "transformers>=4.40",
    "tqdm",
]

[project.optional-dependencies]
esmc = ["esm>=3.0"]
gpu = ["cuml-cu12"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
plmlayer = "plmlayer.cli:main"

[tool.setuptools.packages.find]
include = ["plmlayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs model weights downloaded from the HF hub",
    "slow: slow end-to-end test",
]
